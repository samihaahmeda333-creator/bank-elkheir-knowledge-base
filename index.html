<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بنك الخير للتنمية المستدامة | قاعدة المعرفة</title>
<style>
:root{--navy:#103f4d;--green:#16866d;--teal:#58b9aa;--mint:#e9f5f0;--paper:#f7f9f6;--gold:#c9a75e;--coral:#e58a72;--sky:#83c9d5;--lilac:#a99acb;--ink:#173d3a;--muted:#708681;--line:#dce9e3;--white:#fff;--shadow:0 12px 35px #103f4d12}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.85 Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:var(--green);color:#fff}button:hover{filter:brightness(.96)}.secondary{background:var(--mint);color:var(--navy)}.gold{background:#f3ecd9;color:#705a2a}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#e9f5f0;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;padding:8px 8px 22px;border-bottom:1px solid #ffffff22}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(140deg,var(--teal),#fff);display:grid;place-items:center;color:var(--navy);font-size:22px;font-weight:bold}.brand b{display:block;font-size:16px}.brand small{color:#b9dcd2}.side-label{font-size:11px;color:#8dc7b8;letter-spacing:.5px;margin:23px 10px 7px}.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:transparent;color:#e6f3ef;padding:10px 12px;margin:3px 0;border-radius:10px}.navbtn .ico{width:24px;text-align:center;color:#8fd0bf}.navbtn.active,.navbtn:hover{background:#ffffff18;color:#fff}.navbtn.active{box-shadow:inset -3px 0 var(--gold)}.side-foot{font-size:11px;color:#a9c9c1;margin:26px 8px 0;border-top:1px solid #ffffff22;padding-top:15px}
main{min-width:0}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4}.crumb{font-size:13px;color:var(--muted)}.top-actions{display:flex;gap:8px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:bold}
.content{max-width:1400px;margin:auto;padding:26px 30px 50px}.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#103f4d,#176d5d);color:#fff;border-radius:22px;padding:30px 34px;box-shadow:var(--shadow)}.hero:before,.hero:after{content:"";position:absolute;border:1px solid #ffffff19;border-radius:50%;width:300px;height:300px;left:8%;top:-190px}.hero:after{width:220px;height:220px;left:21%;top:-140px}.eyebrow{color:#bce5d9;font-size:12px}.hero h1{font-size:clamp(25px,3vw,36px);line-height:1.4;margin:8px 0}.hero p{color:#d6ebe4;max-width:730px;margin:0 0 18px}.hero-actions{display:flex;gap:9px;flex-wrap:wrap}.hero .cta{background:var(--gold);color:#173d3a;font-weight:bold}.hero .ghost{background:#ffffff18;color:white;border:1px solid #ffffff35}.hero-mark{position:absolute;left:45px;bottom:18px;font-size:78px;opacity:.12}
.searchbox{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;display:flex;gap:10px;box-shadow:var(--shadow)}.searchbox input{flex:1;min-width:0;border:0;outline:0;padding:7px 10px;font-size:16px}.searchhint{font-size:11px;color:var(--muted);margin:7px 5px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;gap:12px;align-items:center}.stat-icon{width:42px;height:42px;border-radius:13px;background:var(--mint);display:grid;place-items:center;font-size:20px}.stat b{font-size:21px;color:var(--navy);display:block;line-height:1.3}.stat small{color:var(--muted);font-size:11px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:25px 0 12px}.section-head h2{margin:0;color:var(--navy);font-size:21px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;transition:.18s;cursor:pointer;min-height:145px;position:relative;overflow:hidden}.tile:nth-child(4n+1) .tileicon{background:#e5f4ef;color:#16866d}.tile:nth-child(4n+2) .tileicon{background:#fff0e8;color:#d9785e}.tile:nth-child(4n+3) .tileicon{background:#e8f3fb;color:#397da5}.tile:nth-child(4n) .tileicon{background:#f0ebfa;color:#8067ad}.stat:nth-child(4n+2) .stat-icon{background:#fff0e8}.stat:nth-child(4n+3) .stat-icon{background:#e8f3fb}.stat:nth-child(4n) .stat-icon{background:#f0ebfa}.navbtn.active{background:#ffffff20}.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#b5d9cc}.tile .tileicon{width:40px;height:40px;background:var(--mint);border-radius:12px;display:grid;place-items:center;font-size:20px;margin-bottom:9px}.tile h3{margin:0;color:var(--navy);font-size:16px}.tile p{margin:4px 0 0;color:var(--muted);font-size:12px}.tile .arr{position:absolute;left:15px;bottom:14px;color:var(--teal)}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:16px}.panel h3{margin:0 0 9px;color:var(--navy)}.quicklist{display:grid;gap:8px}.quick{display:flex;justify-content:space-between;gap:10px;padding:10px;border-radius:10px;background:#f7faf8;cursor:pointer}.quick:hover{background:var(--mint)}.quick small{color:var(--muted)}
.result-list{display:grid;gap:11px}.result{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.result h3{margin:0;color:var(--navy)}.result p{margin:7px 0;color:#3f5e57}.meta{font-size:11px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap}.pill{background:var(--mint);color:#26715f;padding:2px 9px;border-radius:30px}.article{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}.article h1{margin:4px 0;color:var(--navy);font-size:28px}.article .lead{color:#54716a;font-size:15px}.article h3{color:var(--green);margin:20px 0 6px}.article p{white-space:pre-line}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0}.metric{background:var(--mint);border-radius:12px;padding:12px;text-align:center}.metric b{display:block;font-size:23px;color:var(--green)}.metric small{font-size:11px;color:var(--muted)}table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:9px;text-align:center}th{color:var(--navy);background:#f5faf7}.callout{background:#f7f2e5;border-right:4px solid var(--gold);padding:12px 14px;border-radius:10px;margin:14px 0;font-size:13px}.agentbox{background:linear-gradient(135deg,#eaf6f1,#f8fbf8);border:1px solid #cfe6dc;border-radius:15px;padding:17px;margin-top:18px}.agentbox h3{margin:0;color:var(--navy)}.agentbox p{font-size:13px;color:#47645d}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar button{font-size:12px}
.modal{display:none;position:fixed;inset:0;background:#0b2932c9;z-index:10;place-items:center;padding:16px}.modal.show{display:grid}.dialog{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:22px}.dialog h2{color:var(--navy);margin-top:0}.dialog label{font-size:12px;color:var(--muted);display:block}.dialog input,.dialog textarea,.dialog select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;margin:4px 0 12px}.dialog textarea{min-height:90px}.hidden{display:none!important}.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border-radius:15px;border:1px dashed var(--line)}
@media(max-width:1000px){.app{grid-template-columns:220px 1fr}.tiles{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.app{display:block}.sidebar{height:auto;position:relative;padding:12px}.brand{padding-bottom:10px}.side-label,.side-foot{display:none}.side-nav{display:flex;overflow:auto;gap:5px;margin-top:10px}.navbtn{white-space:nowrap;width:auto;margin:0}.topbar{padding:0 14px}.content{padding:16px}.hero{padding:23px}.hero-mark{display:none}.tiles{grid-template-columns:1fr}.two{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,1fr)}}
.board-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.board-card{border-top:4px solid var(--teal);min-height:205px}.board-card .tileicon{font-size:18px;font-weight:bold;background:#e2f4ef;color:#145d55;border-radius:12px;width:48px;height:42px;display:grid;place-items:center}.board-card h3{line-height:1.7}.quick{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid #e6eee9}.quick b{color:var(--navy)}
</style></head>

{cat:"الأنشطة والبرامج",icon:"🛡️",title:"عناصر الأمان التي تعمل عليها المؤسسة",lead:"الأمان الصحي، التعليمي، المجتمعي، والأسري/التكافلي.",body:"الأمان الصحي: يشمل حضانات الأطفال حديثي الولادة والخدمات والعمليات الطبية.\nالأمان التعليمي: يشمل كتاب الخير والعودة إلى المدارس.\nالأمان المجتمعي: يشمل المستلزمات والتجهيزات للعرائس وتسهيل الزواج.\nالأمان الأسري/التكافلي: يشمل تسديد ديون الغارمات بعد دراسة وافية لظروفهن وموقفهن القانوني.\nكما يذكر الملف إنشاء مراكز طبية في القرى والنجوع.",metrics:"4 عناصر رئيسية للأمان كما يعرضها الملف.",tags:"الأمان الصحي، التعليمي، المجتمعي، الأسري، التكافلي، الغارمات، الحضانات",source:"Portfolio 2026 - صفحة 7"},
{cat:"الأنشطة والبرامج",icon:"💧",title:"وصلات المياه",lead:"توصيل مياه الشرب الصالحة للأسر في القرى والنجوع التي لا تصلها المياه العذبة بسهولة.",body:"يشرح الملف أن بعض السكان يضطرون إلى قطع مسافات للحصول على المياه أو شراء المياه من آخرين، بما يسبب مشقة واستغلالًا ماديًا. تسعى المؤسسة إلى تنفيذ الوصلات بالمجان لتوفير الوقت والجهد والزحام، وتوفير حق أساسي للأسر.\nويذكر الملف تنفيذ وصلات مياه بمحافظة الأقصر وخزانات مياه للشرب بالمحافظات الحدودية.",metrics:"مخطط الإنجازات: 2022: 27 وصلة؛ 2023: 16؛ 2024: 38؛ العام الحالي بالملف: 85.\nكما يذكر وصف النشاط: توصيل مياه لـ450 منزلًا بمحافظة الأقصر، وتوفير 100 خزان مياه للشرب بالمحافظات الحدودية. لا تُجمع هذه الأرقام مع المخطط دون التأكد من عدم التداخل.",tags:"مياه، وصلات مياه، خزانات، الأقصر، 450 منزل، 100 خزان، قرى، نجوع",source:"Portfolio 2026 - صفحات 9 و36"},
{cat:"الأنشطة والبرامج",icon:"🏠",title:"أسقف المنازل",lead:"تنفيذ أسقف للمنازل التي تحتاج إلى حماية من حرارة الصيف وبرد الشتاء.",body:"يستهدف النشاط تحسين ظروف السكن وحماية الأسر من الظروف الجوية. وتعرض صفحات الحملات أعمال أسقف لمنازل في محافظة الأقصر ضمن مبادرة ستر.",metrics:"مخطط الإنجازات: 2022: 26؛ 2023: 50؛ 2024: 60؛ العام الحالي بالملف: 225.\nالإجمالي الحسابي للأرقام المعروضة: 361.",tags:"أسقف، منازل، ترميم، حماية، مبادرة ستر، الأقصر",source:"Portfolio 2026 - صفحات 9 و26 و35"},
{cat:"الأنشطة والبرامج",icon:"🩺",title:"العمليات الجراحية والخدمات الطبية",lead:"دعم إجراء عمليات جراحية وفق احتياج المريض وبعد دراسة الحالة.",body:"يذكر الملف عمليات متنوعة، منها عمليات العيون، وعمليات القلب المفتوح للأطفال، وزراعة القوقعة، وزرع النخاع، وحقن العصب، وحالات الشلل الدماغي.\nكما يذكر تنفيذ أكثر من 100 عملية عيون، وصيانة 150 جهازًا للقوقعة، وإجراء 20 عملية قلب مفتوح للأطفال، وصرف 100 روشتة علاجية.",metrics:"مخطط العمليات: 2022: 1؛ 2023: 30؛ 2024: 68؛ العام الحالي بالملف: 80. الإجمالي الحسابي: 179 عملية.\nأرقام خدمات طبية أخرى منفصلة: أكثر من 100 عملية عيون؛ صيانة 150 جهاز قوقعة؛ 20 عملية قلب مفتوح للأطفال؛ 100 روشتة علاجية. لا تُجمع مع عدد العمليات دون تمييز.",tags:"عمليات، جراحات، عيون، قلب مفتوح، قوقعة، نخاع، حقن عصب، روشتات، شلل دماغي",source:"Portfolio 2026 - صفحات 10 و31 و32 و33"},

{cat:"الأنشطة والبرامج",icon:"📚",title:"رعاية وكفالة طلاب العلم",lead:"دعم الطلاب وتقديم أوجه الرعاية التعليمية.",body:"يعرض الملف أعدادًا سنوية تحت بند أوجه الرعاية للطلاب، دون تفصيل نوع كل وجه رعاية في المخطط. لذلك ينبغي استخدام وصف «أوجه رعاية» كما ورد وعدم تحويله تلقائيًا إلى عدد طلاب فريدين.",metrics:"2022: 12؛ 2023: 28؛ 2024: 35؛ العام الحالي بالملف: 50. الإجمالي الحسابي: 125 وجه رعاية وفق تسمية المخطط.",tags:"طلاب العلم، رعاية، كفالة، تعليم، مدارس",source:"Portfolio 2026 - صفحة 11"},

{cat:"الأنشطة والبرامج",icon:"♿",title:"الكراسي المتحركة ومساعدات الإعاقة",lead:"توفير وسائل مساعدة للأشخاص ذوي الإعاقة الحركية والبصرية والسمعية.",body:"يذكر الملف توفير كراسي متحركة كهربائية للأشخاص ذوي الإعاقة الحركية من عمر 5 سنوات حتى 60 عامًا، وأطراف صناعية. ولأصحاب الإعاقة البصرية: العصي البيضاء. وللإعاقات السمعية: سماعات الأذن وزراعة القوقعة للأطفال.\nكما يذكر إجراء عملية جراحية حسب حاجة المريض للأمراض المسببة للإعاقات مثل ضمور العضلات. نوع الكرسي الكهربائي المذكور WeCare، وإنتاج مؤسسة أراب هيلث.",metrics:"مخطط الكراسي الكهربائية: 2022: 3؛ 2023: 5؛ 2024: 12؛ العام الحالي بالملف: 17. الإجمالي الحسابي: 37 كرسيًا.",tags:"إعاقة، كراسي متحركة، كرسي كهربائي، WeCare، أطراف صناعية، عصا بيضاء، سماعات، قوقعة، ضمور العضلات",source:"Portfolio 2026 - صفحات 15 و16 و17"},
{cat:"الأنشطة والبرامج",icon:"🤝",title:"فك الغارمات",lead:"دراسة ظروف الغارمات وموقفهن القانوني ثم سداد الدين وفق ما ورد في الملف.",body:"تدرس المؤسسة ظروف الغارمات وما تم صرفه والظروف التي أدت إلى الدين، وتدرس الموقف القانوني بعناية شديدة، ثم يتم سداد الدين عنهن وفق ما ورد بالملف، بما يساعد على عودة الاستقرار والحياة إلى الأسرة من جديد.",metrics:"2022: 3؛ 2023: 7؛ 2024: 25؛ العام الحالي بالملف: 32. الإجمالي الحسابي: 67 حالة.",tags:"فك غارمات، سداد ديون، دراسة قانونية، استقرار أسري، حالات",source:"Portfolio 2026 - صفحات 7 و15"},
{cat:"الأنشطة والبرامج",icon:"🍲",title:"وجبات الإطعام وإفطار صائم",lead:"تقديم وجبات إطعام وإفطار صائم للأهالي والأسر المحتاجة.",body:"يذكر الملف تعاونًا مع مؤسسة الهلال الأحمر المصري في إطلاق حملة إفطار صائم خلال شهر رمضان.",metrics:"2022: 400؛ 2023: 550؛ 2024: 2750؛ العام الحالي بالملف: 45800. الإجمالي الحسابي: 49500 وجبة وفق مخطط الإنجازات.",tags:"إطعام، وجبات، إفطار صائم، رمضان، الهلال الأحمر المصري",source:"Portfolio 2026 - صفحات 18 و27"},

{cat:"الأنشطة والبرامج",icon:"👶",title:"إنشاء مركز حضانات",lead:"إنشاء مركز حضانات في عام 2023، بدأ بأربعة أجهزة حضانات.",body:"يذكر الملف إنشاء مركز حضانات في عام 2023. وتوضح صفحة الأنشطة أن المركز بدأ بأربعة أجهزة حضانات، واستقبل 13 طفلًا في اليوم الأول للافتتاح.",metrics:"عام الإنشاء: 2023؛ عدد أجهزة الحضانات عند البداية: 4؛ عدد الأطفال في اليوم الأول: 13.",tags:"مركز حضانات، أطفال، حديثو الولادة، مبتسرين، أجهزة حضانات",source:"Portfolio 2026 - صفحتا 19 و26"},

{cat:"الأنشطة والبرامج",icon:"🌷",title:"أنشطة دعم المرأة",lead:"يعرض الملف أنشطة لدعم المرأة في مجالات الصحة والتوعية والتدريب.",body:"تتضمن صفحات أنشطة دعم المرأة ندوات عن الرضاعة الطبيعية وسرطان الثدي، وقوافل طبية للسيدات، وتدريب الخياطة. كما تعرض بيانات لأنشطة في أكثر من محافظة، مع أعداد سنوية للندوات والقوافل والتدريبات.",metrics:"الملف يعرض جداول منفصلة للندوات الطبية، والقوافل الطبية للسيدات، والندوات الاجتماعية/التدريبية. تُراجع صفحة 21 و22 لتحديد أرقام كل محافظة وسنة قبل نقلها إلى تقرير رسمي.",tags:"المرأة، سيدات، رضاعة طبيعية، سرطان الثدي، قوافل نسائية، خياطة، تدريب",source:"Portfolio 2026 - صفحتا 21 و22"},

{cat:"الحملات والمبادرات",icon:"🍼",title:"حملة الحضانة حياة",lead:"مشروع لإنشاء مركز حضانات للأطفال حديثي الولادة المبتسرين بالمجان.",body:"يوثق الملف حملة إنشاء مركز حضانات للأطفال حديثي الولادة المبتسرين بالمجان في محافظة الأقصر، بهدف توفير الرعاية الطبية للأطفال الذين يحتاجون إلى الحضانات ومساندة أسرهم.",metrics:"مركز الحضانات بدأ بأربعة أجهزة، واستقبل 13 طفلًا في اليوم الأول للافتتاح وفق صفحة النشاط.",tags:"الحضانة حياة، حضانات، أطفال مبتسرين، الأقصر، حملة",source:"Portfolio 2026 - صفحة 25"},

function downloadData(name,content,type){
 const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function openArticle(id){let x=db.find(a=>a.id===id);if(!x)return;setCrumb(x.title);$("view").innerHTML=`<div class="toolbar"><button class="secondary" onclick="${activeCat?`showCategory('${esc(activeCat)}')`:'showAll()'}">← رجوع للقائمة</button><button class="secondary" onclick="editArticle('${x.id}')">✎ تعديل الملف</button><button onclick="copyArticle('${x.id}')">نسخ ملخص للـ Agent</button></div><article class="article"><div class="meta"><span class="pill">${esc(x.cat)}</span><span>مرجع: ${esc(x.source)}</span></div><h1>${esc(x.title)}</h1><div class="lead">${esc(x.lead)}</div><h3>عن النشاط / المعلومة</h3><p>${esc(x.body)}</p>${x.metrics?`<h3>الأرقام والإنجازات</h3><div class="callout">${esc(x.metrics)}</div>`:""}<h3>كلمات مفتاحية للبحث</h3><div class="meta">${x.tags.split(/[،,]/).map(t=>`<span class="pill">${esc(t.trim())}</span>`).join("")}</div><div class="agentbox"><h3>✦ استخدم المعلومة في حديثك مع العميل</h3><p>${esc(x.lead)} اعتمد على التفاصيل والأرقام المذكورة أعلاه كما هي، واذكر مصدرها عند الحاجة. لا تضف وعودًا أو أرقامًا غير موثقة.</p><button onclick="copyArticle('${x.id}')">نسخ بطاقة المعرفة</button></div></article>`}
function copyArticle(id){let x=db.find(a=>a.id===id);let txt=`${x.title}\nالقسم: ${x.cat}\nالملخص: ${x.lead}\nالتفاصيل:\n${x.body}\nالأرقام:\n${x.metrics}\nالمصدر: ${x.source}\nالكلمات المفتاحية: ${x.tags}`;navigator.clipboard.writeText(txt).then(()=>alert("تم نسخ بطاقة المعرفة"))}
function agentMode(){activeCat="";nav();setCrumb("مساعد الـ Agent");$("view").innerHTML=`<section class="hero"><div class="eyebrow">AGENT DESK · مساحة المساعدة</div><h1>خلّي المعلومة تقود الحوار.</h1><p>اكتب سؤال العميل أو الكلمات اللي بيدور عليها، وهتظهرلك المواد المرتبطة من قاعدة المعرفة مع مصدر كل معلومة.</p></section><div class="searchbox"><span>✦</span><input id="agentQ" placeholder="مثال: العميل بيسأل عن عدد الحالات اللي اتساعدت في فك الغارمات..." onkeydown="if(event.key==='Enter')agentSearch()"><button onclick="agentSearch()">استخرج الإجابة</button></div><div class="searchhint">المساعد هنا بيسترجع محتوى المكتبة فقط؛ لا يخترع إجابة إذا كانت المعلومة غير موجودة.</div><div id="agentResults" style="margin-top:18px"><div class="empty">ابدأ بسؤال أو اكتب كلمة مفتاحية.</div></div><div class="agentbox"><h3>قواعد ذهبية أثناء المكالمة</h3><p>اسمع العميل · افهم احتياجه · استخدم المعلومة الموثقة · وضّح أثر المساهمة · احترم قراره. لو الرقم أو الشرط مش موجود في المصدر، ارجع للفريق المختص بدل التخمين.</p></div>`}
function agentSearch(){let q=$("agentQ").value.toLowerCase();let hits=db.map(x=>({...x,score:[x.title,x.lead,x.body,x.metrics,x.tags].join(" ").toLowerCase().split(q).length-1})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8);$("agentResults").innerHTML=hits.length?`<div class="section-head"><div><h2>المواد الأقرب لسؤالك</h2><p>${hits.length} ملفات معرفة مرتبطة</p></div></div><div class="result-list">${hits.map(x=>`<div class="result"><div class="meta"><span class="pill">${esc(x.cat)}</span><span>${esc(x.source)}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.lead)}</p><button onclick="openArticle('${x.id}')">افتح التفاصيل</button></div>`).join("")}</div>`:`<div class="empty">المعلومة دي مش موجودة بشكل موثق في المكتبة حاليًا. الأفضل تأكيدها من الفريق المختص بدل تقديم إجابة غير دقيقة.</div>`}
function openEditor(id=""){let x=db.find(a=>a.id===id);$("editId").value=id;$("formTitle").textContent=id?"تعديل ملف المعرفة":"إضافة معرفة جديدة";$("fTitle").value=x?.title||"";$("fCat").innerHTML=[...categories(),"قسم جديد..."].map(c=>`<option>${esc(c)}</option>`).join("");$("fCat").value=x?.cat||categories()[0];$("fLead").value=x?.lead||"";$("fBody").value=x?.body||"";$("fMetrics").value=x?.metrics||"";$("fTags").value=x?.tags||"";$("fSource").value=x?.source||"";$("modal").classList.add("show")}
function editArticle(id){openEditor(id)}function closeEditor(){$("modal").classList.remove("show")}
function saveArticle(){let id=$("editId").value,title=$("fTitle").value.trim(),body=$("fBody").value.trim();if(!title||!body)return alert("اكتب عنوان المعلومة والتفاصيل");let cat=$("fCat").value;if(cat==="قسم جديد..."){cat=prompt("اكتب اسم القسم الجديد");if(!cat)return}let x={id:id||"custom"+Date.now(),cat,icon:catIcons[cat]||"✦",title,lead:$("fLead").value.trim(),body,metrics:$("fMetrics").value.trim(),tags:$("fTags").value.trim(),source:$("fSource").value.trim()||"إضافة داخلية"};db=id?db.map(a=>a.id===id?x:a):[x,...db];saveDB();closeEditor();nav();openArticle(x.id)}
function exportDB(){let b=new Blob([JSON.stringify({organization:"مؤسسة بنك الخير للتنمية المستدامة",source:"Portfolio 2026",items:db},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="bank-elkheir-knowledge-base.json";a.click();URL.revokeObjectURL(a.href)}
function importDB(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result),a=Array.isArray(j)?j:j.items;if(!Array.isArray(a))throw 0;if(confirm("استبدال قاعدة المعرفة الحالية بالنسخة المستوردة؟")){db=a;saveDB();nav();goHome()}}catch(_){alert("ملف JSON غير صالح")}};r.readAsText(f)}
nav();goHome();
</script></body></html>
