ير هادفة للربح","source":"Portfolio 2026 - صفحة 1"},{"cat":"عن المؤسسة","icon":"💚","title":"رسالة المؤسسة وطريقة العمل","lead":"الاستجابة العاجلة لاحتياجات ومشكلات الأسر مع دراسة وافية للاحتياج الفعلي.","body":"تذكر المؤسسة أن هدفها الاستجابة العاجلة لاحتياجات ومشكلات الأسر، ولهفة من القلب لتلبيتها، مع السعي المتواصل لإسعادهم.\nوتوضح أنها تعمل بأسلوب علمي وبعد دراسة وافية وبحث مستمر عن احتياجات الأسر، للتأكد من الاحتياج الفعلي قبل اتخاذ إجراءات المساعدة.","metrics":"منهج العمل: دراسة اجتماعية وميدانية قبل تقديم المساعدة.","tags":"رسالة، بحث اجتماعي، دراسة حالة، احتياجات الأسر، منهج العمل","source":"Portfolio 2026 - صفحة 2"},{"cat":"عن المؤسسة","icon":"🌱","title":"رؤية المؤسسة","lead":"توفير الأمان للمجتمعات التي تحتاج إليه والوصول إلى مجتمعات آمنة ومستدامة.","body":"تتمثل الرؤية في توفير الأمان للمجتمعات التي تحتاج إليه، والوصول إلى مجتمعات آمنة ومستدامة قادرة على إحداث تغييرات إيجابية.","metrics":"الرؤية: مجتمعات آمنة ومستدامة.","tags":"الرؤية، الأمان، الاستدامة، المجتمع","source":"Portfolio 2026 - صفحة 3"},{"cat":"عن المؤسسة","icon":"🎯","title":"هدف المؤسسة ونطاق العمل","lead":"وضع مصلحة الأسرة والفرد في مقدمة المساعي والتوسع في تقديم الخدمات.","body":"تضع المؤسسة مصلحة الأسرة والفرد داخل المجتمع في مقدمة مساعيها، وتسعى لتقديم الخدمات التي توفر للأسرة الأمان الكامل في المعيشة المجتمعية.\nويذكر الملف أن المؤسسة تسعى إلى وجود فروع في جميع محافظات وقرى جمهورية مصر العربية، للوصول بالخدمات إلى من يستحقها.","metrics":"نطاق العمل المستهدف: محافظات وقرى جمهورية مصر العربية.","tags":"هدف، الأسرة، الفرد، فروع، محافظات، قرى، نطاق العمل","source":"Portfolio 2026 - صفحتا 4 و5"},{"cat":"الحوكمة والقيم","icon":"✨","title":"القيم الأساسية","lead":"الاستدامة والشفافية والريادة هي القيم الأساسية المذكورة في الملف.","body":"الشفافية: العمل بشفافية ودراسة الحالات والبحث الميداني.\nالاستدامة: استمرار العطاء.\nالريادة: تطوير الخدمات والمعايير والرعاية.","metrics":"القيم: الاستدامة · الشفافية · الريادة","tags":"قيم، استدامة، شفافية، ريادة، حوكمة","source":"Portfolio 2026 - صفحة 6"},{"cat":"الحوكمة والقيم","icon":"👥","title":"مجلس الأمناء","lead":"يخصص ملف المؤسسة صفحة لأعضاء مجلس الأمناء.","body":"يتضمن ملف Portfolio صفحة مخصصة لمجلس الأمناء وأسماء الأعضاء. يجب الرجوع إلى صفحة 8 في ملف PDF عند الحاجة إلى نقل الأسماء حرفيًا؛ لا تُعتمد أسماء غير مقروءة أو غير مؤكدة.","metrics":"تفاصيل الأسماء: تُراجع من صفحة المصدر الأصلية.","tags":"مجلس الأمناء، أعضاء، حوكمة، إدارة","source":"Portfolio 2026 - صفحة 8"},{"cat":"الأنشطة والبرامج","icon":"🛡️","title":"عناصر الأمان التي تعمل عليها المؤسسة","lead":"الأمان الصحي، التعليمي، المجتمعي، والأسري/التكافلي.","body":"الأمان الصحي: يشمل حضانات الأطفال حديثي الولادة والخدمات والعمليات الطبية.\nالأمان التعليمي: يشمل كتاب الخير والعودة إلى المدارس.\nالأمان المجتمعي: يشمل المستلزمات والتجهيزات للعرائس وتسهيل الزواج.\nالأمان الأسري/التكافلي: يشمل تسديد ديون الغارمات بعد دراسة وافية لظروفهن وموقفهن القانوني.\nكما يذكر الملف إنشاء مراكز طبية في القرى والنجوع.","metrics":"4 عناصر رئيسية للأمان كما يعرضها الملف.","tags":"الأمان الصحي، التعليمي، المجتمعي، الأسري، التكافلي، الغارمات، الحضانات","source":"Portfolio 2026 - صفحة 7"},{"cat":"الأنشطة والبرامج","icon":"💧","title":"وصلات المياه","lead":"توصيل مياه الشرب الصالحة للأسر في القرى والنجوع التي لا تصلها المياه العذبة بسهولة.","body":"يشرح الملف أن بعض السكان يضطرون إلى قطع مسافات للحصول على المياه أو شراء المياه من آخرين، بما يسبب مشقة واستغلالًا ماديًا. تسعى المؤسسة إلى تنفيذ الوصلات بالمجان لتوفير الوقت والجهد والزحام، وتوفير حق أساسي للأسر.\nويذكر الملف تنفيذ وصلات مياه بمحافظة الأقصر وخزانات مياه للشرب بالمحافظات الحدودية.","metrics":"مخطط الإنجازات: 2022: 27 وصلة؛ 2023: 16؛ 2024: 38؛ العام الحالي بالملف: 85.\nكما يذكر وصف النشاط: توصيل مياه لـ450 منزلًا بمحافظة الأقصر، وتوفير 100 خزان مياه للشرب بالمحافظات الحدودية. لا تُجمع هذه الأرقام مع المخطط دون التأكد من عدم التداخل.","tags":"مياه، وصلات مياه، خزانات، الأقصر، 450 منزل، 100 خزان، قرى، نجوع","source":"Portfolio 2026 - صفحات 9 و36"},{"cat":"الأنشطة والبرامج","icon":"🏠","title":"أسقف المنازل","lead":"تنفيذ أسقف للمنازل التي تحتاج إلى حماية من حرارة الصيف وبرد الشتاء.","body":"يستهدف النشاط تحسين ظروف السكن وحماية الأسر من الظروف الجوية. وتعرض صفحات الحملات أعمال أسقف لمنازل في محافظة الأقصر ضمن مبادرة ستر.","metrics":"مخطط الإنجازات: 2022: 26؛ 2023: 50؛ 2024: 60؛ العام الحالي بالملف: 225.\nالإجمالي الحسابي للأرقام المعروضة: 361.","tags":"أسقف، منازل، ترميم، حماية، مبادرة ستر، الأقصر","source":"Portfolio 2026 - صفحات 9 و26 و35"},{"cat":"الأنشطة والبرامج","icon":"🩺","title":"العمليات الجراحية والخدمات الطبية","lead":"دعم إجراء عمليات جراحية وفق احتياج المريض وبعد دراسة الحالة.","body":"يذكر الملف عمليات متنوعة، منها عمليات العيون، وعمليات القلب المفتوح للأطفال، وزراعة القوقعة، وزرع النخاع، وحقن العصب، وحالات الشلل الدماغي.\nكما يذكر تنفيذ أكثر من 100 عملية عيون، وصيانة 150 جهازًا للقوقعة، وإجراء 20 عملية قلب مفتوح للأطفال، وصرف 100 روشتة علاجية.","metrics":"مخطط العمليات: 2022: 1؛ 2023: 30؛ 2024: 68؛ العام الحالي بالملف: 80. الإجمالي الحسابي: 179 عملية.\nأرقام خدمات طبية أخرى منفصلة: أكثر من 100 عملية عيون؛ صيانة 150 جهاز قوقعة؛ 20 عملية قلب مفتوح للأطفال؛ 100 روشتة علاجية. لا تُجمع مع عدد العمليات دون تمييز.","tags":"عمليات، جراحات، عيون، قلب مفتوح، قوقعة، نخاع، حقن عصب، روشتات، شلل دماغي","source":"Portfolio 2026 - صفحات 10 و31 و32 و33"},{"cat":"الأنشطة والبرامج","icon":"👰","title":"تجهيز العرائس","lead":"توفير المستلزمات والتجهيزات للعرائس غير القادرات ومساندة الأسرة في بداية حياتها.","body":"يهدف النشاط إلى تسهيل وتعجيل الزواج الذي طال انتظاره، وتوفير المستلزمات والتجهيزات للعرائس غير القادرات.","metrics":"مخطط الإنجازات: 2022: 15؛ 2023: 32؛ 2024: 45؛ العام الحالي بالملف: 35. الإجمالي الحسابي: 127 حالة تجهيز.","tags":"تجهيز عرائس، زواج، مستلزمات، تجهيز","source":"Portfolio 2026 - صفحة 10"},{"cat":"الأنشطة والبرامج","icon":"📚","title":"رعاية وكفالة طلاب العلم","lead":"دعم الطلاب وتقديم أوجه الرعاية التعليمية.","body":"يعرض الملف أعدادًا سنوية تحت بند أوجه الرعاية للطلاب، دون تفصيل نوع كل وجه رعاية في المخطط. لذلك ينبغي استخدام وصف «أوجه رعاية» كما ورد وعدم تحويله تلقائيًا إلى عدد طلاب فريدين.","metrics":"2022: 12؛ 2023: 28؛ 2024: 35؛ العام الحالي بالملف: 50. الإجمالي الحسابي: 125 وجه رعاية وفق تسمية المخطط.","tags":"طلاب العلم، رعاية، كفالة، تعليم، مدارس","source":"Portfolio 2026 - صفحة 11"},{"cat":"الأنشطة والبرامج","icon":"🧑‍⚕️","title":"القوافل الطبية","lead":"تنظيم قوافل طبية لتقديم خدمات الكشف والرعاية الطبية.","body":"يعرض ملف الأنشطة القوافل الطبية باعتبارها أحد مجالات العمل الصحي للمؤسسة.","metrics":"2022: 0؛ 2023: 12؛ 2024: 15؛ العام الحالي بالملف: 125. الإجمالي الحسابي: 152 وفق وحدة المخطط.","tags":"قوافل طبية، كشف، رعاية صحية، طب، أطباء","source":"Portfolio 2026 - صفحة 11"},{"cat":"الأنشطة والبرامج","icon":"🛒","title":"كراتين المواد الغذائية","lead":"توزيع كراتين مواد غذائية على الأسر المستحقة، مع مبادرات خاصة خلال شهر رمضان.","body":"توزيع كراتين المواد الغذائية على الأسر المستحقة ضمن أنشطة الدعم الغذائي، وتظهر الحملة في الملف كأحد الأنشطة المتكررة.","metrics":"2022: 600؛ 2023: 850؛ 2024: 1600؛ العام الحالي بالملف: 2950. الإجمالي الحسابي: 6000 كرتونة.","tags":"كراتين غذائية، مواد غذائية، أسر، رمضان، كراتين الخير","source":"Portfolio 2026 - صفحات 12 و29"},{"cat":"الأنشطة والبرامج","icon":"🧣","title":"توزيع الألحفة","lead":"توزيع الألحفة على الأسر المستحقة لمساعدتها على مواجهة برد الشتاء.","body":"نشاط دعم معيشي يهدف إلى تحسين ظروف المعيشة ومساعدة الأسر على مواجهة برد الشتاء.","metrics":"2022: 150؛ 2023: 200؛ 2024: 450؛ العام الحالي بالملف: 1250. الإجمالي الحسابي: 2050 لحافًا.","tags":"ألحفة، شتاء، بطاطين، توزيع","source":"Portfolio 2026 - صفحة 12"},{"cat":"الأنشطة والبرامج","icon":"🛏️","title":"توزيع المراتب والمخدات","lead":"توفير مراتب ومخدات للأسر المستحقة لتحسين ظروف المعيشة.","body":"يوثق الملف توزيع المراتب والمخدات ضمن أنشطة الدعم المعيشي للأسر.","metrics":"2022: 60؛ 2023: 80؛ 2024: 125؛ العام الحالي بالملف: 225. الإجمالي الحسابي: 490 وفق وحدة المخطط التي تجمع المراتب والمخدات معًا.","tags":"مراتب، مخدات، دعم أسري، تجهيز منزل","source":"Portfolio 2026 - صفحة 13"},{"cat":"الأنشطة والبرامج","icon":"🥩","title":"توزيع اللحوم","lead":"توزيع اللحوم على الأسر المستحقة ضمن أنشطة الدعم الغذائي.","body":"نشاط لتقديم الدعم الغذائي للأسر المستحقة.","metrics":"2022: 225؛ 2023: 431؛ 2024: 1720؛ العام الحالي بالملف: 2850. الإجمالي الحسابي: 5226 وفق وحدة المخطط.","tags":"لحوم، توزيع، غذاء، أسر","source":"Portfolio 2026 - صفحة 13"},{"cat":"الأنشطة والبرامج","icon":"👕","title":"توزيع الكساء","lead":"توزيع الكساء والملابس على الأسر المستحقة لتلبية الاحتياجات الأساسية.","body":"يظهر توزيع الكساء كأحد أنشطة المؤسسة لدعم الأسر.","metrics":"2022: 275؛ 2023: 600؛ 2024: 800؛ العام الحالي بالملف: 1276. الإجمالي الحسابي: 2951.","tags":"كساء، ملابس، توزيع، احتياجات أساسية","source":"Portfolio 2026 - صفحة 14"},{"cat":"الأنشطة والبرامج","icon":"🎒","title":"توزيع الشنط المدرسية","lead":"توفير شنط مدرسية لدعم الطلاب وتخفيف الأعباء المدرسية عن الأسر.","body":"نشاط مرتبط بدعم التعليم والعودة إلى المدارس من خلال توفير الشنط المدرسية.","metrics":"2022: 500؛ 2023: 650؛ 2024: 600؛ العام الحالي بالملف: 1000. الإجمالي الحسابي: 2750 شنطة.","tags":"شنط مدرسية، تعليم، طلاب، مدارس، العودة للمدارس","source":"Portfolio 2026 - صفحة 14"},{"cat":"الأنشطة والبرامج","icon":"♿","title":"الكراسي المتحركة ومساعدات الإعاقة","lead":"توفير وسائل مساعدة للأشخاص ذوي الإعاقة الحركية والبصرية والسمعية.","body":"يذكر الملف توفير كراسي متحركة كهربائية للأشخاص ذوي الإعاقة الحركية من عمر 5 سنوات حتى 60 عامًا، وأطراف صناعية. ولأصحاب الإعاقة البصرية: العصي البيضاء. وللإعاقات السمعية: سماعات الأذن وزراعة القوقعة للأطفال.\nكما يذكر إجراء عملية جراحية حسب حاجة المريض للأمراض المسببة للإعاقات مثل ضمور العضلات. نوع الكرسي الكهربائي المذكور WeCare، وإنتاج مؤسسة أراب هيلث.","metrics":"مخطط الكراسي الكهربائية: 2022: 3؛ 2023: 5؛ 2024: 12؛ العام الحالي بالملف: 17. الإجمالي الحسابي: 37 كرسيًا.","tags":"إعاقة، كراسي متحركة، كرسي كهربائي، WeCare، أطراف صناعية، عصا بيضاء، سماعات، قوقعة، ضمور العضلات","source":"Portfolio 2026 - صفحات 15 و16 و17"},{"cat":"الأنشطة والبرامج","icon":"🤝","title":"فك الغارمات","lead":"دراسة ظروف الغارمات وموقفهن القانوني ثم سداد الدين وفق ما ورد في الملف.","body":"تدرس المؤسسة ظروف الغارمات وما تم صرفه والظروف التي أدت إلى الدين، وتدرس الموقف القانوني بعناية شديدة، ثم يتم سداد الدين عنهن وفق ما ورد بالملف، بما يساعد على عودة الاستقرار والحياة إلى الأسرة من جديد.","metrics":"2022: 3؛ 2023: 7؛ 2024: 25؛ العام الحالي بالملف: 32. الإجمالي الحسابي: 67 حالة.","tags":"فك غارمات، سداد ديون، دراسة قانونية، استقرار أسري، حالات","source":"Portfolio 2026 - صفحات 7 و15"},{"cat":"الأنشطة والبرامج","icon":"🍲","title":"وجبات الإطعام وإفطار صائم","lead":"تقديم وجبات إطعام وإفطار صائم للأهالي والأسر المحتاجة.","body":"يذكر الملف تعاونًا مع مؤسسة الهلال الأحمر المصري في إطلاق حملة إفطار صائم خلال شهر رمضان.","metrics":"2022: 400؛ 2023: 550؛ 2024: 2750؛ العام الحالي بالملف: 45800. الإجمالي الحسابي: 49500 وجبة وفق مخطط الإنجازات.","tags":"إطعام، وجبات، إفطار صائم، رمضان، الهلال الأحمر المصري","source":"Portfolio 2026 - صفحات 18 و27"},{"cat":"الأنشطة والبرامج","icon":"📖","title":"دار تحفيظ القرآن الكريم","lead":"يذكر الملف تجهيز دار لتحفيظ القرآن الكريم في عام 2023.","body":"تجهيز دار لتحفيظ القرآن الكريم. لا يورد الملف في الصفحة نفسها عدد الدارسين أو عدد الحلقات.","metrics":"عام التجهيز المذكور: 2023. عدد الدارسين: غير مذكور في المصدر.","tags":"دار تحفيظ، قرآن كريم، 2023","source":"Portfolio 2026 - صفحة 19"},{"cat":"الأنشطة والبرامج","icon":"👶","title":"إنشاء مركز حضانات","lead":"إنشاء مركز حضانات في عام 2023، بدأ بأربعة أجهزة حضانات.","body":"يذكر الملف إنشاء مركز حضانات في عام 2023. وتوضح صفحة الأنشطة أن المركز بدأ بأربعة أجهزة حضانات، واستقبل 13 طفلًا في اليوم الأول للافتتاح.","metrics":"عام الإنشاء: 2023؛ عدد أجهزة الحضانات عند البداية: 4؛ عدد الأطفال في اليوم الأول: 13.","tags":"مركز حضانات، أطفال، حديثو الولادة، مبتسرين، أجهزة حضانات","source":"Portfolio 2026 - صفحتا 19 و26"},{"cat":"الأنشطة والبرامج","icon":"🏅","title":"تكريم حفظة القرآن الكريم","lead":"تنظيم تكريم لحفظة القرآن الكريم ويعرض الملف أعداد المكرمين على مدار سنوات.","body":"تنظيم تكريم لحفظة القرآن الكريم ضمن أنشطة المؤسسة.","metrics":"2022: 185؛ 2023: 225؛ 2024: 365؛ العام الحالي بالملف: 652. الإجمالي الحسابي: 1427 مكرمًا.","tags":"تكريم، حفظة القرآن، مسابقات، مكرمين","source":"Portfolio 2026 - صفحة 20"},{"cat":"الأنشطة والبرامج","icon":"🌷","title":"أنشطة دعم المرأة","lead":"يعرض الملف أنشطة لدعم المرأة في مجالات الصحة والتوعية والتدريب.","body":"تتضمن صفحات أنشطة دعم المرأة ندوات عن الرضاعة الطبيعية وسرطان الثدي، وقوافل طبية للسيدات، وتدريب الخياطة. كما تعرض بيانات لأنشطة في أكثر من محافظة، مع أعداد سنوية للندوات والقوافل والتدريبات.","metrics":"الملف يعرض جداول منفصلة للندوات الطبية، والقوافل الطبية للسيدات، والندوات الاجتماعية/التدريبية. تُراجع صفحة 21 و22 لتحديد أرقام كل محافظة وسنة قبل نقلها إلى تقرير رسمي.","tags":"المرأة، سيدات، رضاعة طبيعية، سرطان الثدي، قوافل نسائية، خياطة، تدريب","source":"Portfolio 2026 - صفحتا 21 و22"},{"cat":"الحملات والمبادرات","icon":"🎁","title":"حملة كراتين الخير","lead":"حملة لتوزيع كراتين المواد الغذائية على الأسر المستحقة خلال شهر رمضان.","body":"يذكر الملف أن الحملة استهدفت الأسر الأولى بالرعاية، وأن توزيع الكراتين يساعد على توفير الاحتياجات الغذائية خلال الشهر الكريم وإدخال البهجة على الأسر.","metrics":"عدد الكراتين الدقيق في نص صفحة الحملة غير مثبت هنا؛ راجع مخطط نشاط كراتين المواد الغذائية في صفحة 12 للأرقام السنوية.","tags":"كراتين الخير، رمضان، أسر مستحقة، غذاء، حملة","source":"Portfolio 2026 - صفحة 24"},{"cat":"الحملات والمبادرات","icon":"🍼","title":"حملة الحضانة حياة","lead":"مشروع لإنشاء مركز حضانات للأطفال حديثي الولادة المبتسرين بالمجان.","body":"يوثق الملف حملة إنشاء مركز حضانات للأطفال حديثي الولادة المبتسرين بالمجان في محافظة الأقصر، بهدف توفير الرعاية الطبية للأطفال الذين يحتاجون إلى الحضانات ومساندة أسرهم.","metrics":"مركز الحضانات بدأ بأربعة أجهزة، واستقبل 13 طفلًا في اليوم الأول للافتتاح وفق صفحة النشاط.","tags":"الحضانة حياة، حضانات، أطفال مبتسرين، الأقصر، حملة","source":"Portfolio 2026 - صفحة 25"},{"cat":"الحملات والمبادرات","icon":"🏡","title":"حملة بناء سقف لكل بيت محتاج","lead":"حملة لمساندة المنازل التي تحتاج إلى أسقف لحماية الأسر.","body":"تعرض صفحة الحملة أهمية وجود سقف آمن يحمي الأسرة من حرارة الصيف وبرد الشتاء، وتوضح تدخل المؤسسة لدعم الأهالي بأعمال الأسقف.","metrics":"تُراجع أرقام التنفيذ من مخطط نشاط أسقف المنازل وصفحة مبادرة ستر.","tags":"بناء سقف، بيت محتاج، أسقف، منازل، حماية، حملة","source":"Portfolio 2026 - صفحة 26"},{"cat":"الحملات والمبادرات","icon":"🌙","title":"حملة إفطار صائم","lead":"حملة بالتعاون مع مؤسسة الهلال الأحمر المصري لتقديم وجبات إفطار خلال رمضان.","body":"أطلقت المؤسسة حملة إفطار صائم بالتعاون مع مؤسسة الهلال الأحمر المصري، لتقديم المساندة للأهالي والأسر المحتاجة خلال شهر رمضان. يذكر الملف أن الحملة لاقت نجاحًا وتوسعًا كبيرًا.","metrics":"أرقام الوجبات السنوية تظهر في نشاط وجبات الإطعام وإفطار الصائم.","tags":"إفطار صائم، الهلال الأحمر المصري، رمضان، وجبات","source":"Portfolio 2026 - صفحة 27"},{"cat":"الحملات والمبادرات","icon":"👁️","title":"حملة شوف بكرة بعينك","lead":"حملة لمكافحة مرض الجلوكوما (المياه الزرقاء) بالتعاون مع شركة جمجوم للصناعات الدوائية.","body":"أشرف على الحملة أطباء وأساتذة جراحة العيون في مصر. استهدفت التوعية بالمرض وطرق تجنبه والتوعية بمخاطر الإصابة، وكان الكشف والعلاج بالمجان للأهالي والأسر وفق النص الوارد في الملف.","metrics":"لم يذكر النص المتاح رقمًا إجماليًا محددًا للحالات في صفحة الحملة.","tags":"شوف بكرة بعينك، جلوكوما، مياه زرقاء، جمجوم، عيون، كشف مجاني","source":"Portfolio 2026 - صفحة 28"},{"cat":"الحملات والمبادرات","icon":"🩸","title":"حملة التبرع بالدم","lead":"حملة للتبرع بالدم تحت إشراف أطباء متخصصين في اليوم العالمي للسعادة.","body":"أطلقت المؤسسة حملة للتبرع بالدم تحت إشراف نخبة من الأطباء الأكفاء، وذلك في اليوم العالمي للسعادة. يذكر الملف أن الحملة ساعدت عددًا من الحالات المستحقة التي كانت تحتاج إلى الدم، دون ذكر عدد محدد.","metrics":"عدد الحالات أو وحدات الدم غير محدد في نص الصفحة.","tags":"التبرع بالدم، اليوم العالمي للسعادة، أطباء، حملة","source":"Portfolio 2026 - صفحة 30"},{"cat":"الحملات والمبادرات","icon":"🌾","title":"مبادرة سكة خير","lead":"مبادرة بالتعاون مع البنك الزراعي المصري لتوزيع 5000 وجبة في خمس محافظات.","body":"يوثق الملف مبادرة بالتعاون مع البنك الزراعي المصري لتوزيع 5000 وجبة خلال شهر رمضان المبارك في خمس محافظات.","metrics":"5000 وجبة · 5 محافظات.","tags":"سكة خير، البنك الزراعي المصري، 5000 وجبة، خمس محافظات، رمضان","source":"Portfolio 2026 - صفحة 34"},{"cat":"الحملات والمبادرات","icon":"🧱","title":"مبادرة ستر بمحافظة الأقصر","lead":"مبادرة تنموية تضمنت أعمال أسقف لـ100 منزل ووصلات مياه وتجهيز منازل بالكامل.","body":"يصف الملف مبادرة ستر بأنها أكبر مبادرة تنموية في محافظة الأقصر، وشملت أعمال أسقف لعدد 100 منزل، ووصلات مياه، وتجهيز منازل بالكامل.","metrics":"100 منزل بأعمال أسقف وفق النص؛ بالإضافة إلى وصلات مياه وتجهيز منازل بالكامل.","tags":"مبادرة ستر، الأقصر، 100 منزل، أسقف، مياه، تجهيز منازل","source":"Portfolio 2026 - صفحة 35"},{"cat":"قصص الأثر","icon":"❤️","title":"أثر المؤسسة في المجال الطبي","lead":"يعرض الملف نماذج لخدمات طبية ومساعدات علاجية قدمتها المؤسسة.","body":"تتضمن أمثلة الملف: أكثر من 100 عملية عيون، و20 عملية قلب مفتوح للأطفال، وصيانة 150 جهازًا للقوقعة، وصرف 100 روشتة علاجية. هذه نماذج خدمات مختلفة ويجب عرض كل رقم مع نوع الخدمة الخاص به.","metrics":"100+ عملية عيون؛ 20 عملية قلب مفتوح للأطفال؛ 150 جهاز قوقعة تمت صيانته؛ 100 روشتة علاجية.","tags":"قصص أثر، طب، عيون، قلب، قوقعة، روشتات، حالات","source":"Portfolio 2026 - صفحات 31 و32 و33"},{"cat":"دليل الـ Agent","icon":"💬","title":"مبادئ التواصل الإنساني مع العميل","lead":"استمع أولًا، قدّم المعلومة المعتمدة، وخلّي أثر الخير واضحًا من غير ضغط.","body":"1) ابدأ بالاستماع وفهم احتياج العميل قبل عرض أي مساهمة.\n2) استخدم لغة دافئة ومحترمة تحفظ كرامة المستفيد.\n3) اشرح أثر البرنامج بناءً على معلومات المؤسسة فقط.\n4) لا تبالغ ولا تضغط على العميل ولا تشعره بالذنب.\n5) لا تخترع شروطًا أو أسعارًا أو وعودًا أو أعدادًا.\n6) إذا لم تتوفر إجابة موثقة، وضّح أن المعلومة تحتاج إلى تأكيد من الفريق المختص.","metrics":"القاعدة الذهبية: تعاطف + صدق + وضوح + احترام اختيار العميل.","tags":"agent، مكالمات، عميل، تعاطف، صدق، لباقة، خدمة عملاء","source":"دليل تحريري داخلي مقترح مبني على رسالة المؤسسة"},{"cat":"بيانات التواصل","icon":"📞","title":"بيانات التواصل العامة","lead":"بيانات الاتصال الظاهرة في ملف Portfolio 2026.","body":"الموقع: www.bankelkheir.org\nالبريد الإلكتروني: info@bankelkheir.org\nأرقام الاتصال الظاهرة: 0227770107 و01002001661.\nيعرض الملف بيانات فروع وأكواد تبرع إضافية في الصفحتين 37 و38؛ يجب مراجعة الصورة الأصلية قبل اعتماد كل رقم أو كود.","metrics":"الموقع والبريد والأرقام أعلاه من النص المقروء في صفحات التواصل.","tags":"تواصل، موقع، بريد إلكتروني، هاتف، فروع، تبرع","source":"Portfolio 2026 - صفحتا 37 و38"}],"usage_notes":{"for_agent":"استخدم محتوى المقالات بوصفه المصدر الأساسي. حافظ على الوحدات والسنوات والقيود كما وردت. لا تستنتج أرقامًا أو شروط أهلية غير موجودة. إذا كانت المعلومة غير واضحة أو غير مذكورة، اطلب تأكيدها من فريق المؤسسة.","source_policy":"كل مادة تحتوي على مرجع صفحة من ملف Portfolio 2026. راجع ملف PDF الأصلي قبل استخدام الأرقام أو النصوص الملتبسة خارجيًا."}};

function nav(){ $("nav").innerHTML=navItems.map(([id,label,ic])=>'<button class="'+(page===id?'active':'')+'" onclick="go(\''+id+'\')">'+ic+' '+label+'</button>').join("")}

function stats(){return '<div class="quickstats"><div class="stat"><b>2022</b><span>عام تأسيس المؤسسة</span></div><div class="stat"><b>4</b><span>محاور للأمان المجتمعي</span></div><div class="stat"><b>5,000</b><span>وجبة في مبادرة سكة خير</span></div><div class="stat"><b>5</b><span>محافظات شملتها المبادرة</span></div></div>'}
function tile(icon,title,desc,action,count){return '<button class="tile" onclick="'+action+'"><span class="symbol">'+icon+'</span><h3>'+title+'</h3><p>'+desc+'</p>'+(count?'<span class="count">'+count+'</span>':'')+'</button>'}
function home(){$("view").innerHTML='<section class="hero"><div class="hero-copy"><div class="kicker">معًا نصنع أثرًا يدوم</div><h1>كل معلومة وراءها حكاية خير</h1><p>مرجع واحد يساعد فريق بنك الخير على فهم رسالتنا، والتعرّف على برامجنا، وتقديم المعلومة للناس بصدق ودفء واحترام.</p><div class="searchbar"><input id="searchHome" placeholder="دوري على برنامج، حملة، خدمة، أو كلمة..." onkeydown="if(event.key===\'Enter\')doSearch()"><button onclick="doSearch()">ابحثي في المكتبة</button></div><div class="hero-quote">"الخير مش مجرد مساعدة… الخير أمان وكرامة وفرصة لبداية أفضل."</div></div></section>'+stats()+'<div class="section-head"><div><div class="accent-line"></div><h2>ابدئي من هنا</h2><p>خمس وجهات أساسية بدل الزحمة وكثرة الأقسام</p></div></div><div class="tiles">'+tile("✦","من نحن","رسالة المؤسسة، رؤيتها، قيمها، ومجلس الأمناء","go(\'about\')","التعريف والحوكمة")+tile("🌱","برامجنا","الخدمات الصحية والتعليمية والغذائية والسكنية والتكافلية","go(\'programs\')","كل الأنشطة في مكان واحد")+tile("💛","حملاتنا","المبادرات والحملات الموسمية والشراكات","go(\'campaigns\')","الحملات والمبادرات")+tile("♥","أثرنا","نماذج من الإنجازات والأرقام كما وردت في الملف","go(\'impact\')","أثر بالأرقام")+tile("☏","دليل الفريق","مبادئ التواصل والرد على استفسارات العملاء","go(\'guide\')","مرجع عملي للـ Agent")+'</div><section class="warm-band"><div class="heart">♥</div><div><h3>كل رقم في المكتبة يمثل احتياجًا إنسانيًا وراءه أسرة أو طفل أو طالب.</h3><p>نحكي أثر العمل باحترام، ونحافظ على دقة الأرقام وكرامة الناس، من غير مبالغة أو وعود غير موثقة.</p></div></section>'}
function about(){const arr=A.filter(x=>x.cat==="عن المؤسسة"||x.cat==="الحوكمة والقيم");const board=DB.board||DB.board_of_trustees||[];const values=arr.find(x=>x.title==="القيم الأساسية");const intro=arr.filter(x=>["التعريف بالمؤسسة","رسالة المؤسسة وطريقة العمل","رؤية المؤسسة","هدف المؤسسة ونطاق العمل"].includes(x.title));$("view").innerHTML='<div class="section-head"><div><div class="accent-line"></div><h2>من نحن</h2><p>نبذة المؤسسة ورسالتها ورؤيتها وقيمها ومجلس أمنائها في مكان واحد</p></div></div><section class="detail"><div class="tag">بنك الخير للتنمية المستدامة</div><h1>الأمان بداية التنمية</h1><p class="lead">'+safe(DB.about)+'</p><p>تأسست المؤسسة عام <strong>'+safe(DB.organization.established_year)+'</strong> · رقم الإشهار <strong>'+safe(DB.organization.registration_number)+'</strong>.</p><h3>نبذة ورسالة ورؤية المؤسسة</h3><div class="cards">'+intro.map(card).join("")+'</div><h3>قيمنا الأساسية</h3><div class="values-grid"><div class="value-card"><b>الاستدامة</b><p>استمرار العطاء والعمل على أثر يمتد ولا يتوقف عند المساعدة اللحظية.</p></div><div class="value-card"><b>الشفافية</b><p>العمل بوضوح، ودراسة الحالات والبحث الميداني قبل تقديم المساعدة.</p></div><div class="value-card"><b>الريادة</b><p>تطوير الخدمات والمعايير والرعاية بما يواكب احتياجات المجتمع.</p></div></div><p class="source">'+safe(values?.source||"Portfolio 2026 - صفحة 6")+'</p><h3>مجلس الأمناء</h3><div class="board">'+board.map(x=>'<div class="person"><strong>'+safe(x.name)+'</strong><p>'+safe(x.role)+'</p><p>'+safe(x.qualification)+'</p></div>').join("")+'</div><div class="note">بيانات مجلس الأمناء من صفحة 8 في الملف التعريفي. يُرجى مراجعة تهجئة المؤهلات وجهات العمل من النسخة الأصلية قبل استخدامها في مواد رسمية.</div><div class="source">المصدر: Portfolio 2026 · الصفحات 1–8</div></section>'}
function card(x){return '<article class="card"><span class="tag">'+safe(x.cat)+' · '+safe(x.source)+'</span><h3>'+safe(x.title)+'</h3><p>'+safe(x.lead)+'</p><button onclick="openArticle('+A.indexOf(x)+')">اقرئي التفاصيل ←</button></article>'}
function programs(){const arr=A.filter(x=>x.cat==="الأنشطة والبرامج");$("view").innerHTML='<div class="section-head"><div><div class="accent-line"></div><h2>برامجنا وخدماتنا</h2><p>كل نشاط بتفاصيله وأرقامه والصفحات المرجعية</p></div></div><div class="content-grid"><aside class="filters"><h3>اختاري مجال البرنامج</h3><div class="filter-buttons">'+programFilters.map(f=>'<button class="'+(filter===f?'active':'')+'" onclick="setFilter(\''+f+'\')">'+f+'</button>').join("")+'</div></aside><section><div class="cards" id="programCards">'+arr.map(card).join("")+'</div></section></div>'}
function setFilter(f){filter=f;const arr=A.filter(x=>x.cat==="الأنشطة والبرامج"&&(f==="الكل"||((x.title+" "+x.lead+" "+x.body).includes(({صحي:"طبي|صحي|قلب|عيون|قوقعة|قوافل",تعليمي:"تعليم|طلاب|مدرسية|قرآن|حفظة",غذائي:"غذاء|غذائية|وجبات|لحوم|إطعام|ألحفة",سكني:"منازل|أسقف|مياه|مراتب|مخدات",تكافلي:"غارمات|عرائس|كساء",مجتمعي:"مياه|دعم|مرأة"}[f]||f)))));const terms=({صحي:["الطبية","الطبي","القلب","العيون","القوقعة","القوافل"],تعليمي:["التعليم","الطلاب","المدرسية","القرآن","حفظة"],غذائي:["الغذاء","الغذائية","وجبات","اللحوم","الإطعام","الألحفة"],سكني:["المنازل","الأسقف","المياه","المراتب","المخدات"],تكافلي:["الغارمات","العرائس","الكساء"],مجتمعي:["المياه","المرأة","الدعم"]})[f]||[];const filtered=f==="الكل"?A.filter(x=>x.cat==="الأنشطة والبرامج"):A.filter(x=>x.cat==="الأنشطة والبرامج"&&terms.some(t=>(x.title+" "+x.lead+" "+x.body).includes(t)));$("programCards").innerHTML=filtered.length?filtered.map(card).join(""):'<div class="empty">لا توجد مواد في هذا التصنيف.</div>';document.querySelectorAll(".filters button").forEach(b=>b.classList.toggle("active",b.textContent===f))}
function listing(cat,title,icon){const arr=A.filter(x=>x.cat===cat);$("view").innerHTML='<div class="section-head"><div><div class="accent-line"></div><h2>'+icon+' '+title+'</h2><p>الحملات والمبادرات كما وثقها الملف التعريفي</p></div></div><div class="cards">'+arr.map(card).join("")+'</div>'}
function impact(){const arr=A.filter(x=>x.cat==="قصص الأثر"||x.title==="وصلات المياه"||x.title==="أسقف المنازل"||x.title==="العمليات الجراحية والخدمات الطبية"||x.title==="وجبات الإطعام وإفطار صائم"||x.title==="إنشاء مركز حضانات"||x.title==="تكريم حفظة القرآن الكريم");$("view").innerHTML='<div class="section-head"><div><div class="accent-line"></div><h2>أثرنا بالأرقام</h2><p>الأرقام هنا كما وردت في الملف، وكل رقم مرتبط بنوع الخدمة ومصدره</p></div></div><section class="warm-band"><div class="heart">♥</div><div><h3>الأرقام بتوصف حجم العمل، لكن الأثر الحقيقي في حياة الناس.</h3><p>نحافظ على معنى كل رقم ووحدته وسنته، ولا نجمع أرقامًا من خدمات مختلفة في إجمالي مضلل.</p></div></section><div class="cards">'+arr.map(card).join("")+'</div>'}
function guide(){const arr=A.filter(x=>x.cat==="دليل الـ Agent"||x.cat==="بيانات التواصل");$("view").innerHTML='<div class="section-head"><div><div class="accent-line"></div><h2>دليل الفريق</h2><p>تواصل إنساني ومعلومة دقيقة في كل مكالمة ورسالة</p></div></div><section class="warm-band"><div class="heart">♥</div><div><h3>اسمع باهتمام، اشرح بوضوح، وسيب للعميل مساحة يختار.</h3><p>مهمتنا مش الضغط على الناس؛ مهمتنا نوصل الحقيقة عن خدمات المؤسسة باحترام وشفافية.</p></div></section><div class="cards">'+arr.map(card).join("")+'</div>'}
function metricDisplay(metrics){if(!metrics)return "";return '<section class="achievement-panel"><div class="achievement-heading"><span>✦</span><div><b>إنجازات وخدمات البرنامج</b><small>الأرقام كما وردت في الملف التعريفي</small></div></div><div class="achievement-lines">'+String(metrics).split(/\n/).map(line=>'<div class="achievement-line">'+safe(line).replace(/(\d[\d,،]*\+?)/g,'<strong class="metric-num">$1</strong>')+'</div>').join("")+'</div></section>'}
function openArticle(i){const x=A[i];page="detail";nav();const back=x.cat==="عن المؤسسة"||x.cat==="الحوكمة والقيم"?"about":x.cat==="الأنشطة والبرامج"?"programs":x.cat==="الحملات والمبادرات"?"campaigns":x.cat==="قصص الأثر"?"impact":"guide";$("view").innerHTML='<div class="section-head"><div><div class="accent-line"></div><h2>'+safe(x.cat)+'</h2><p>تفاصيل المادة المعرفية</p></div><button class="back" onclick="go(\''+back+'\')">← رجوع</button></div><article class="detail"><div class="tag">'+safe(x.source)+'</div><h1>'+safe(x.title)+'</h1>'+metricDisplay(x.metrics)+'<p class="lead">'+safe(x.lead)+'</p><h3>تفاصيل البرنامج والخدمات المقدمة</h3><p>'+safe(x.body)+'</p><div class="source">المصدر: '+safe(x.source)+'</div></article>';window.scrollTo({top:0,behavior:"smooth"})}
function doSearch(){const q=($("searchHome")?.value||"").trim().toLowerCase();if(!q)return;const hits=A.filter(x=>(x.title+" "+x.lead+" "+x.body+" "+x.metrics+" "+x.cat+" "+x.tags).toLowerCase().includes(q));page="search";nav();$("view").innerHTML='<div class="section-head"><div><div class="accent-line"></div><h2>نتائج البحث</h2><p>بحث عن: '+safe(q)+' · '+hits.length+' نتيجة</p></div><button class="back" onclick="go(\'home\')">الرئيسية</button></div><div class="cards">'+(hits.length?hits.map(card).join(""):'<div class="empty">ملقيناش نتيجة مطابقة. جرّبي كلمة مختلفة.</div>')+'</div>';window.scrollTo({top:0,behavior:"smooth"})}
nav();home();
</script></body></html>
